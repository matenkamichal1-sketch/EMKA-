const grid = document.getElementById('galleryGrid');
photos.forEach((photo, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'photo';
  const img = document.createElement('img');
  img.src = photo.src;
  img.alt = photo.title || `Realizacja ${i+1}`;
  img.loading = i === 0 ? 'eager' : 'lazy';
  const cap = document.createElement('div');
  cap.className = 'caption';
  cap.textContent = photo.title || `Realizacja ${i+1}`;
  wrap.append(img, cap);
  grid.appendChild(wrap);
});

const t=document.querySelector('.menuToggle'),m=document.querySelector('.mobileMenu');
if(t&&m){
  t.addEventListener('click',()=>{const o=m.classList.toggle('open');t.setAttribute('aria-expanded',o)});
  m.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>m.classList.remove('open')));
}
</script>
